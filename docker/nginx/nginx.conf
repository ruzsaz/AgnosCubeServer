events {  }
http {
    upstream agnos-cube {
        server agnos-cube-server-1:7979 fail_timeout=0;
        server agnos-cube-server-2:7979 fail_timeout=0;
    }
    server {
        listen 7979;

        location / {
            proxy_pass http://agnos-cube;
            proxy_next_upstream error timeout http_503;
        }

        location /stats {
          stub_status on;
          allow all;
        }

        location /acs/refresh {
            proxy_pass http://agnos-cube-server-1:7979;
            post_action @refresh2;
        }
        location @refresh2 {
            proxy_pass http://agnos-cube-server-2:7979;
        }

        # /acs/restart must reach BOTH cube servers, otherwise the round-robin in
        # "location /" restarts only one of them and the other keeps serving the
        # cubes it already has in memory. Sequential like /acs/refresh, not mirrored
        # like /acs/prepare: a restarting cube server answers 503 to every request,
        # so restarting both at once would take the whole cluster down meanwhile.
        location /acs/restart {
            proxy_pass http://agnos-cube-server-1:7979;
            post_action @restart2;
        }
        location @restart2 {
            proxy_pass http://agnos-cube-server-2:7979;
        }

        location /acs/prepare {
            mirror /mirror;
            proxy_pass http://agnos-cube-server-1:7979;
        }
        location /mirror {
            internal;
            proxy_pass http://agnos-cube-server-2:7979$request_uri;
        }

    }
}